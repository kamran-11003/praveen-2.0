<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAK Center Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh; width: 100vw;
            display: flex;
            color: #fff;
        }

        /* ═══ left: avatar (60%) ═══ */
        #left-panel {
            flex: 0 0 60%;
            position: relative;
            height: 100vh;
        }
        #avatar-container { width: 100%; height: 100%; }

        #status {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 16px;
            padding: 8px 22px;
            background: rgba(0,0,0,0.55);
            border-radius: 30px; z-index: 100;
            backdrop-filter: blur(10px); white-space: nowrap;
        }
        body.listening #status {
            animation: pulse 1.5s infinite;
            background: rgba(76,175,80,0.4);
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
            50%      { box-shadow: 0 0 0 14px rgba(76,175,80,0); }
        }

        #vad-meter {
            position: absolute; top: 60px; left: 50%;
            transform: translateX(-50%);
            width: 180px; height: 5px;
            background: rgba(255,255,255,0.12);
            border-radius: 3px; z-index: 100; overflow: hidden;
            display: none;
        }
        #vad-bar {
            height: 100%; width: 0%;
            background: #4CAF50;
            border-radius: 3px;
            transition: width 0.05s;
        }

        #controls {
            position: absolute; bottom: 96px; left: 50%;
            transform: translateX(-50%); z-index: 100;
            display: flex; gap: 12px;
        }
        .btn {
            padding: 12px 30px; border: none; border-radius: 50px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn-start { background: linear-gradient(135deg,#4CAF50,#45a049); color:#fff; }
        .btn-stop  { background: linear-gradient(135deg,#f44336,#d32f2f); color:#fff; display:none; }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ═══ right: services panel (40%, transparent) ═══ */
        #services-panel {
            flex: 0 0 40%;
            height: 100vh;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.08);
            overflow-y: auto;
            padding: 0 0 90px 0;   /* bottom padding so cards never hide under subtitle bar */
        }
        #services-panel::-webkit-scrollbar { width: 6px; }
        #services-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.18);
            border-radius: 3px;
        }

        #services-header {
            padding: 18px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky; top: 0;
            background: rgba(20,20,40,0.55);
            backdrop-filter: blur(20px);
            z-index: 5;
        }
        #services-header h2 {
            font-size: 18px; font-weight: 600;
            color: #fff;
        }
        #services-header .lang-toggle {
            margin-top: 10px; display: flex; gap: 6px;
        }
        .lang-btn {
            padding: 5px 14px; border-radius: 14px;
            font-size: 12px; cursor: pointer;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .lang-btn.active {
            background: #4CAF50; color: #fff;
            border-color: #4CAF50;
        }

        .dept-section { padding: 0; }
        .dept-header {
            position: sticky;
            top: 78px;          /* below #services-header */
            padding: 10px 22px;
            background: rgba(20,20,40,0.85);
            backdrop-filter: blur(15px);
            font-size: 12px; font-weight: 600;
            color: #ffd54f;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            z-index: 4;
        }
        .dept-meta {
            font-size: 10px; color: rgba(255,255,255,0.45);
            margin-left: 6px; font-weight: 400;
            text-transform: none; letter-spacing: 0;
        }

        .service-card {
            padding: 12px 22px;
            margin: 2px 0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s, transform 0.1s;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .service-card:hover {
            background: rgba(76,175,80,0.12);
        }
        .service-card:active { transform: scale(0.98); }
        .service-card.unavailable {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .service-card.unavailable:hover { background: transparent; }

        .service-icon {
            font-size: 18px; line-height: 1.2;
            margin-top: 1px;
            color: #4CAF50;
        }
        .service-name {
            flex: 1;
            font-size: 14px; line-height: 1.4;
            color: rgba(255,255,255,0.92);
        }
        .service-name.ur {
            font-size: 16px;
            direction: rtl; text-align: right;
            font-family: 'Noto Nastaliq Urdu','Segoe UI',sans-serif;
        }
        .service-fee {
            font-size: 11px; color: rgba(255,255,255,0.5);
            margin-top: 3px;
        }

        /* ═══ fixed subtitle bar (bottom, full width) ═══ */
        #subtitle-bar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 72px;
            background: rgba(0,0,0,0.78);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6px 28px;
            z-index: 200;
        }
        #sub-user {
            font-size: 13px;
            color: #6dd47e;
            min-height: 16px;
            line-height: 1.3;
            opacity: 0.95;
        }
        #sub-user .label { font-weight: 600; margin-right: 6px; }
        #sub-avatar {
            font-size: 19px;
            color: #fff;
            min-height: 24px;
            line-height: 1.3;
            margin-top: 2px;
            font-weight: 500;
        }
        .sub-rtl { direction: rtl; text-align: right; }

        /* ═══ loading overlay ═══ */
        #loading-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; color:#fff; font-size: 18px;
        }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>Loading Assistant…</div>
    </div>

    <div id="left-panel">
        <div id="avatar-container"></div>
        <div id="status">Connecting…</div>
        <div id="vad-meter"><div id="vad-bar"></div></div>
        <div id="controls">
            <button class="btn btn-start" id="btn-start" disabled>Start Conversation</button>
            <button class="btn btn-stop"  id="btn-stop">Stop</button>
        </div>
    </div>

    <div id="services-panel">
        <div id="services-header">
            <h2>PAK Center Services</h2>
            <div class="lang-toggle">
                <span class="lang-btn active" data-lang="en">English</span>
                <span class="lang-btn" data-lang="ur">اردو</span>
            </div>
        </div>
        <div id="services-list"></div>
    </div>

    <div id="subtitle-bar">
        <div id="sub-user"><span class="label">You:</span><span id="sub-user-text"></span></div>
        <div id="sub-avatar"></div>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <!-- Three.js + TalkingHead import map -->
    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    } }
    </script>

    <script type="module">
    import { TalkingHead } from 'talkinghead';

    // ═══════════════════════════════════════════════════════════════════════
    // DOM refs
    // ═══════════════════════════════════════════════════════════════════════
    const statusEl     = document.getElementById('status');
    const vadMeter     = document.getElementById('vad-meter');
    const vadBar       = document.getElementById('vad-bar');
    const btnStart     = document.getElementById('btn-start');
    const btnStop      = document.getElementById('btn-stop');
    const loadingEl    = document.getElementById('loading-overlay');
    const servicesList = document.getElementById('services-list');
    const subUserText  = document.getElementById('sub-user-text');
    const subAvatarEl  = document.getElementById('sub-avatar');

    // ═══════════════════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════════════════
    let head          = null;
    let socket        = null;
    let vadActive     = false;
    let isSpeaking    = false;
    let audioQueue    = [];
    let processingQ   = false;
    let uiLang        = 'en';   // 'en' | 'ur'   — UI/voice language toggle

    // VAD resources
    let audioCtx      = null;
    let micStream     = null;
    let micSource     = null;
    let scriptProc    = null;

    // VAD tuning
    const VAD_THRESHOLD   = 0.012;
    const SILENCE_MS      = 800;
    const CHUNK_SAMPLES   = 4096;
    const SAMPLE_RATE     = 16000;

    // Recording state
    let recording       = false;
    let recordedSamples = [];
    let silenceStart    = null;

    // Barge-in: ring buffer of last 8 RMS frames + cooldown to avoid double fire
    const BARGE_RING    = new Float32Array(8);
    let bargeRingIdx    = 0;
    let bargeCooldown   = false;     // 300ms after a barge-in fires
    const BARGE_MULT    = 2.5;       // median(ring) > VAD_THRESHOLD * BARGE_MULT

    function pushBargeFrame(rms) {
        BARGE_RING[bargeRingIdx] = rms;
        bargeRingIdx = (bargeRingIdx + 1) % BARGE_RING.length;
    }
    function bargeMedian() {
        const arr = Array.from(BARGE_RING).sort((a,b) => a-b);
        return arr[arr.length >> 1];
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Helpers
    // ═══════════════════════════════════════════════════════════════════════
    function setStatus(txt) { statusEl.textContent = txt; }
    function setListeningClass(on) { document.body.classList.toggle('listening', on); }

    function isUrdu(text) {
        if (!text) return false;
        let arabic = 0, alpha = 0;
        for (const c of text) {
            if (c >= '\u0600' && c <= '\u06FF') arabic++;
            if (/[a-zA-Z\u0600-\u06FF]/.test(c)) alpha++;
        }
        return alpha > 0 && (arabic / alpha) > 0.5;
    }

    function showUserSubtitle(text) {
        subUserText.textContent = text || '';
        subUserText.parentElement.classList.toggle('sub-rtl', isUrdu(text));
    }
    function showAvatarSubtitle(text) {
        subAvatarEl.textContent = text || '';
        subAvatarEl.classList.toggle('sub-rtl', isUrdu(text));
    }
    function clearAvatarSubtitle() { subAvatarEl.textContent = ''; }

    // ═══════════════════════════════════════════════════════════════════════
    // WAV encoding (PCM float32 → WAV ArrayBuffer)
    // ═══════════════════════════════════════════════════════════════════════
    function encodeWAV(samples, sampleRate) {
        const pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        const dataLen = pcm.byteLength;
        const buf = new ArrayBuffer(44 + dataLen);
        const view = new DataView(buf);
        const w  = (off, val, bytes) => {
            if (bytes === 4) view.setUint32(off, val, true);
            else if (bytes === 2) view.setUint16(off, val, true);
            else view.setUint8(off, val);
        };
        const ws = (off, str) => { for (let i=0; i<str.length; i++) view.setUint8(off+i, str.charCodeAt(i)); };
        ws(0, 'RIFF'); w(4, 36 + dataLen, 4); ws(8, 'WAVE');
        ws(12, 'fmt '); w(16, 16, 4); w(20, 1, 2); w(22, 1, 2);
        w(24, sampleRate, 4); w(28, sampleRate * 2, 4);
        w(32, 2, 2); w(34, 16, 2);
        ws(36, 'data'); w(40, dataLen, 4);
        new Int16Array(buf, 44).set(pcm);
        return buf;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VAD — energy-based, with ring-buffer barge-in
    // ═══════════════════════════════════════════════════════════════════════
    async function startVAD() {
        if (vadActive) return;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { sampleRate: SAMPLE_RATE, channelCount: 1,
                         echoCancellation: true, noiseSuppression: true },
                video: false
            });
        } catch (err) {
            setStatus('Mic denied: ' + err.message);
            return;
        }

        audioCtx   = new AudioContext({ sampleRate: SAMPLE_RATE });
        micSource  = audioCtx.createMediaStreamSource(micStream);
        scriptProc = audioCtx.createScriptProcessor(CHUNK_SAMPLES, 1, 1);

        micSource.connect(scriptProc);
        scriptProc.connect(audioCtx.destination);

        vadActive       = true;
        recording       = false;
        recordedSamples = [];
        silenceStart    = null;
        BARGE_RING.fill(0);

        vadMeter.style.display = 'block';

        scriptProc.onaudioprocess = (e) => {
            if (!vadActive) return;
            const input = e.inputBuffer.getChannelData(0);

            // RMS energy
            let sum = 0;
            for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
            const rms = Math.sqrt(sum / input.length);

            vadBar.style.width = Math.min(100, rms * 2000) + '%';

            // ── Barge-in: median over 8-frame ring buffer ────────────────────
            if (isSpeaking) {
                pushBargeFrame(rms);
                if (!bargeCooldown && bargeMedian() > VAD_THRESHOLD * BARGE_MULT) {
                    console.log('[VAD] barge-in (median=', bargeMedian().toFixed(4), ')');
                    bargeCooldown = true;
                    setTimeout(() => { bargeCooldown = false; }, 300);

                    socket.emit('barge_in');
                    head?.stopSpeaking?.();
                    isSpeaking      = false;
                    audioQueue      = [];
                    processingQ     = false;
                    BARGE_RING.fill(0);
                    clearAvatarSubtitle();
                    setStatus('Listening…');
                    setListeningClass(true);
                    recording       = false;
                    recordedSamples = [];
                    silenceStart    = null;
                }
                return;  // don't record while speaking
            }

            // ── Normal VAD ────────────────────────────────────────────────────
            if (rms > VAD_THRESHOLD) {
                if (!recording) {
                    recording       = true;
                    recordedSamples = [];
                    setStatus('Listening…');
                    setListeningClass(true);
                }
                silenceStart = null;
                recordedSamples.push(new Float32Array(input));
            } else if (recording) {
                recordedSamples.push(new Float32Array(input));
                if (silenceStart === null) silenceStart = Date.now();
                if (Date.now() - silenceStart >= SILENCE_MS) {
                    recording = false;
                    setStatus('Transcribing…');
                    setListeningClass(false);
                    sendAudio();
                }
            }
        };

        setStatus('Listening…');
        setListeningClass(true);
    }

    function stopVAD() {
        vadActive = false;
        setListeningClass(false);
        vadMeter.style.display = 'none';
        vadBar.style.width = '0%';

        scriptProc?.disconnect();
        micSource?.disconnect();
        micStream?.getTracks().forEach(t => t.stop());
        scriptProc = null; micSource = null; micStream = null;
        if (audioCtx) { audioCtx.close(); audioCtx = null; }

        recording       = false;
        recordedSamples = [];
        silenceStart    = null;
    }

    function sendAudio() {
        if (recordedSamples.length === 0) return;
        const total = recordedSamples.reduce((s, a) => s + a.length, 0);
        const merged = new Float32Array(total);
        let offset = 0;
        for (const chunk of recordedSamples) { merged.set(chunk, offset); offset += chunk.length; }
        recordedSamples = [];
        const wavBuf = encodeWAV(merged, SAMPLE_RATE);
        socket.emit('audio_data', wavBuf);
        setStatus('Processing…');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Audio queue
    // ═══════════════════════════════════════════════════════════════════════
    async function drainQueue() {
        if (processingQ) return;
        processingQ = true;
        while (audioQueue.length > 0) {
            const item = audioQueue.shift();
            isSpeaking = true;
            setStatus('Speaking…');
            showAvatarSubtitle(item.text);
            if (item.audio && head) {
                await speakChunk(item);
            }
        }
        clearAvatarSubtitle();
        isSpeaking  = false;
        processingQ = false;
    }

    async function speakChunk(data) {
        try {
            const binary = atob(data.audio);
            const bytes  = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            const ctx = new AudioContext();
            const audioBuf = await ctx.decodeAudioData(bytes.buffer.slice(0));

            const lang = data.lang || 'en';
            const lipsyncLang = ['en','fi','lt'].includes(lang) ? lang : 'en';
            const words = adaptWords(data.words || [], lang);

            await new Promise(resolve => {
                try {
                    head.speakAudio(
                        { audio: audioBuf, words,
                          wtimes: data.wtimes || [], wdurations: data.wdurations || [] },
                        { lipsyncLang },
                        resolve
                    );
                    setTimeout(resolve, (audioBuf.duration * 1000) + 600);
                } catch { resolve(); }
            });
            await ctx.close();
        } catch (err) {
            console.error('[speakChunk] error:', err);
        }
    }

    function adaptWords(words, lang) {
        if (['en','fi','lt'].includes(lang)) return words;
        return words.map(w => {
            if (/^[a-zA-Z]+$/.test(w)) return w;
            const n = Math.max(1, Math.ceil(w.length / 3));
            const pats = ['ba','da','ma','la','na'];
            return Array.from({length: n}, (_,i) => pats[i % pats.length]).join('');
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Services panel
    // ═══════════════════════════════════════════════════════════════════════
    let CATALOG = { departments: [], services: [] };

    async function loadCatalog() {
        try {
            const r = await fetch('/api/services');
            CATALOG = await r.json();
            renderServices();
        } catch (err) {
            console.error('Failed to load catalog:', err);
            servicesList.innerHTML =
                '<div style="padding:22px;color:rgba(255,255,255,0.5)">Catalog unavailable.</div>';
        }
    }

    function feeText(svc) {
        const pay = svc.payment_model || {};
        if (pay.type === 'free') {
            return uiLang === 'ur' ? 'مفت' : 'Free';
        }
        const entries = pay.entries || [];
        if (entries.length > 0) return entries[0];
        return '';
    }

    function renderServices() {
        servicesList.innerHTML = '';
        const depts = CATALOG.departments || [];
        const services = CATALOG.services || [];

        // group services by department id
        const byDept = {};
        for (const s of services) {
            const id = (s.department || {}).id || 'OTHER';
            (byDept[id] ||= []).push(s);
        }

        for (const dept of depts) {
            const deptServices = byDept[dept.id] || [];
            if (deptServices.length === 0) continue;

            const section = document.createElement('div');
            section.className = 'dept-section';

            const header = document.createElement('div');
            header.className = 'dept-header';
            header.innerHTML =
                `${dept.code || dept.name} ` +
                `<span class="dept-meta">${dept.name} · ${deptServices.length} services</span>`;
            section.appendChild(header);

            for (const svc of deptServices) {
                section.appendChild(renderCard(svc));
            }
            servicesList.appendChild(section);
        }
    }

    function renderCard(svc) {
        const card = document.createElement('div');
        card.className = 'service-card';
        const unavailable = svc.availability_status === 'not_available_at_center';
        if (unavailable) card.classList.add('unavailable');

        const nameObj = svc.service_name || {};
        const name = (uiLang === 'ur' && nameObj.ur)
            ? nameObj.ur
            : (nameObj.en || svc.service_id);

        const fee = feeText(svc);

        card.innerHTML = `
            <span class="service-icon">›</span>
            <div style="flex:1;min-width:0">
              <div class="service-name ${uiLang === 'ur' && nameObj.ur ? 'ur' : ''}">${escapeHtml(name)}</div>
              ${fee ? `<div class="service-fee">${escapeHtml(fee)}</div>` : ''}
            </div>
        `;

        if (!unavailable) {
            card.addEventListener('click', () => {
                if (!socket || !socket.connected) return;
                // visual feedback
                card.style.background = 'rgba(76,175,80,0.25)';
                setTimeout(() => { card.style.background = ''; }, 250);

                showUserSubtitle(name);
                socket.emit('service_selected',
                            { serviceId: svc.service_id, lang: uiLang });
            });
        }
        return card;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // language toggle
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            uiLang = btn.dataset.lang;
            renderServices();
        });
    });

    // ═══════════════════════════════════════════════════════════════════════
    // Socket.IO
    // ═══════════════════════════════════════════════════════════════════════
    function initSocket() {
        socket = io(window.location.origin);

        socket.on('connect', () => {
            setStatus('Connected');
        });

        socket.on('server_profile', () => {
            socket.emit('request_greeting');
        });

        socket.on('status', (d) => {
            const map = {
                connected: 'Ready', thinking: 'Thinking…',
                processing: 'Processing…', speaking: 'Speaking…',
                error: 'Error', listening: 'Listening…'
            };
            setStatus(map[d.state] || d.message || d.state);
        });

        socket.on('user_text', (d) => {
            showUserSubtitle(d.text || '');
        });

        socket.on('speak_chunk', (d) => {
            audioQueue.push(d);
            drainQueue();
        });

        socket.on('speak_done', () => {
            const waitForQueueAndResume = () => {
                if (processingQ || isSpeaking) {
                    setTimeout(waitForQueueAndResume, 200);
                    return;
                }
                if (vadActive) {
                    setStatus('Listening…');
                    setListeningClass(true);
                }
            };
            waitForQueueAndResume();
        });

        socket.on('cannot_hear', () => {
            showAvatarSubtitle(uiLang === 'ur'
                ? 'معذرت، آواز واضح نہیں آئی۔ دوبارہ کوشش کریں۔'
                : "Sorry, I couldn't hear that. Please try again.");
            setStatus('Listening…');
            setListeningClass(vadActive);
        });

        socket.on('disconnect', () => {
            setStatus('Disconnected');
            stopVAD();
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Avatar init
    // ═══════════════════════════════════════════════════════════════════════
    async function initAvatar() {
        const avatarUrl      = "{{ avatar_url }}";
        const avatarFallback = "{{ avatar_fallback }}";

        head = new TalkingHead(document.getElementById('avatar-container'), {
            cameraView: 'upper',
            cameraRotateEnable: true,
            lipsyncModules: ['en'],
            lipsyncLang: 'en'
        });

        let ok = false;
        try {
            await head.showAvatar({ url: avatarUrl, body: 'F',
                                    avatarMood: 'neutral', lipsyncLang: 'en' });
            ok = true;
        } catch { /* fallback */ }

        if (!ok) {
            await head.showAvatar({ url: avatarFallback, body: 'F',
                                    avatarMood: 'neutral', lipsyncLang: 'en' });
        }

        loadingEl.style.display = 'none';
        setStatus('Ready — click Start');
        btnStart.disabled = false;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Buttons
    // ═══════════════════════════════════════════════════════════════════════
    btnStart.addEventListener('click', async () => {
        btnStart.style.display = 'none';
        btnStop.style.display  = 'inline-block';
        await startVAD();
    });

    btnStop.addEventListener('click', () => {
        stopVAD();
        btnStop.style.display  = 'none';
        btnStart.style.display = 'inline-block';
        setStatus('Stopped');
        isSpeaking  = false;
        audioQueue  = [];
        processingQ = false;
        clearAvatarSubtitle();
    });

    // ═══════════════════════════════════════════════════════════════════════
    // Boot
    // ═══════════════════════════════════════════════════════════════════════
    initSocket();
    loadCatalog();
    try {
        await initAvatar();
    } catch (err) {
        loadingEl.innerHTML = `<div style="color:#f44;text-align:center;padding:20px">
            Avatar failed to load.<br><small>${err.message}</small></div>`;
        console.error('Avatar init error:', err);
    }
    </script>
</body>
</html>
