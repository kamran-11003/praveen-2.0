<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAK Center Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh; width: 100vw;
            display: flex;
            flex-direction: row;   /* avatar left, services right */
            color: #fff;
        }

        /* ═══ left: avatar (60%) ═══ */
        #left-panel {
            flex: 0 0 60%;
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        #avatar-container { width: 100%; height: 100%; }

        #status {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 16px;
            padding: 8px 22px;
            background: rgba(0,0,0,0.55);
            border-radius: 30px; z-index: 100;
            backdrop-filter: blur(10px); white-space: nowrap;
        }
        body.listening #status {
            animation: pulse 1.5s infinite;
            background: rgba(76,175,80,0.4);
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
            50%      { box-shadow: 0 0 0 14px rgba(76,175,80,0); }
        }

        #vad-meter {
            position: absolute; top: 60px; left: 50%;
            transform: translateX(-50%);
            width: 180px; height: 5px;
            background: rgba(255,255,255,0.12);
            border-radius: 3px; z-index: 100; overflow: hidden;
            display: none;
        }
        #vad-bar {
            height: 100%; width: 0%;
            background: #4CAF50;
            border-radius: 3px;
            transition: width 0.05s;
        }

        #controls {
            position: absolute; bottom: 96px; left: 50%;
            transform: translateX(-50%); z-index: 100;
        }
        .btn-new-session {
            padding: 10px 26px; border: none; border-radius: 50px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg,#ef5350,#b71c1c); color:#fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.25s;
        }
        .btn-new-session:hover { transform: scale(1.04); opacity: 0.9; }

        /* ═══ right: services wizard panel (40%) ═══ */
        #services-panel {
            flex: 0 0 40%;
            height: 100vh;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Breadcrumb ── */
        #wizard-crumb {
            flex-shrink: 0;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(20,20,40,0.75);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; gap: 5px;
            min-height: 44px; flex-wrap: wrap;
        }
        .crumb-btn {
            background: none; border: none; cursor: pointer;
            color: rgba(255,255,255,0.5); font-size: 12px;
            padding: 3px 7px; border-radius: 5px;
            transition: color 0.15s, background 0.15s;
        }
        .crumb-btn:hover { color:#fff; background:rgba(255,255,255,0.1); }
        .crumb-sep { color:rgba(255,255,255,0.22); font-size:11px; user-select:none; }
        .crumb-current { font-size:12px; color:#ffd54f; font-weight:700; }

        /* ── Wizard step container ── */
        .wizard-step {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 10px;
        }
        .wizard-step::-webkit-scrollbar { width: 5px; }
        .wizard-step::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }

        /* ── Session footer ── */
        #session-footer {
            flex-shrink: 0;
            padding: 9px 14px;
            border-top: 1px solid rgba(255,255,255,0.07);
            background: rgba(8,8,20,0.9);
        }
        #btn-end-session {
            width: 100%; padding: 9px;
            background: rgba(244,67,54,0.1);
            border: 1px solid rgba(244,67,54,0.28);
            color: #ef9a9a; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        #btn-end-session:hover { background: rgba(244,67,54,0.26); color:#fff; }

        /* ── Step 1: Language selection ── */
        .lang-select-wrap {
            padding: 30px 18px; text-align: center;
        }
        .lang-select-title {
            font-size: 16px; font-weight: 700; color:#fff;
            margin-bottom: 6px; line-height:1.4;
        }
        .lang-select-sub {
            font-size: 13px; color:rgba(255,255,255,0.5);
            margin-bottom: 26px;
        }
        .lang-cards { display:flex; gap:14px; }
        .lang-card-btn {
            flex:1; padding:20px 10px;
            background:rgba(255,255,255,0.05);
            border:2px solid rgba(255,255,255,0.12);
            border-radius:14px; cursor:pointer;
            display:flex; flex-direction:column; align-items:center; gap:10px;
            color:#fff; transition:all 0.2s;
        }
        .lang-card-btn:hover {
            background:rgba(76,175,80,0.15); border-color:#4CAF50;
            transform:translateY(-3px);
        }
        .lang-flag { font-size:32px; }
        .lang-card-label { font-size:16px; font-weight:700; }
        .lang-card-label.ur-label {
            font-size:20px;
            font-family:'Noto Nastaliq Urdu','Segoe UI',sans-serif;
        }
        .lang-card-sub { font-size:11px; color:rgba(255,255,255,0.45); }

        /* ── Step 2: Department grid ── */
        .dept-grid { padding:12px 14px 0; display:flex; flex-direction:column; gap:7px; }
        .dept-card {
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:10px; cursor:pointer;
            padding:13px 14px;
            display:flex; justify-content:space-between; align-items:center;
            text-align:left; color:#fff; transition:all 0.18s; width:100%;
        }
        .dept-card:hover {
            background:rgba(76,175,80,0.12); border-color:rgba(76,175,80,0.4);
            transform:translateX(3px);
        }
        .dept-card-left { flex:1; }
        .dept-card-name { font-size:13px; font-weight:600; line-height:1.3; }
        .dept-card-code { font-size:10px; color:#ffd54f; font-weight:700; margin-top:2px; }
        .dept-card-count { font-size:11px; color:rgba(255,255,255,0.38); flex-shrink:0; }
        .dept-card-arrow { font-size:16px; color:rgba(255,255,255,0.35); margin-left:8px; }

        /* ── Step 3: Service list ── */
        .svc-list { padding:10px 14px 0; display:flex; flex-direction:column; gap:5px; }
        .svc-item {
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:8px; cursor:pointer;
            padding:11px 13px; text-align:left; color:#fff;
            transition:all 0.18s; width:100%;
        }
        .svc-item:hover:not(.unavailable) {
            background:rgba(76,175,80,0.12); border-color:rgba(76,175,80,0.35);
        }
        .svc-item.unavailable { opacity:0.38; cursor:not-allowed; }
        .svc-item-name { font-size:13px; line-height:1.4; }
        .svc-item-name.ur-text {
            font-size:15px; direction:rtl; text-align:right;
            font-family:'Noto Nastaliq Urdu','Segoe UI',sans-serif;
        }
        .svc-item-fee { font-size:11px; color:rgba(255,255,255,0.4); margin-top:3px; }
        .svc-item-na  { font-size:10px; color:#e57373; margin-top:2px; }

        /* (dept/service-card styles replaced by wizard step styles above) */

        /* ═══ step 4: service detail (re-uses .detail-top / .detail-section etc.) ═══ */
        #step-detail {
            background: rgba(12,12,30,0.6);
        }
        #step-detail::-webkit-scrollbar { width: 5px; }
        #step-detail::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        .detail-top {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky; top: 0;
            background: rgba(12,12,30,0.97);
            backdrop-filter: blur(16px);
            z-index: 5;
        }
        .btn-back {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; border-radius: 50%;
            width: 32px; height: 32px;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.18); }
        .detail-title-wrap { flex: 1; min-width: 0; }
        .detail-title-en {
            font-size: 14px; font-weight: 600;
            color: #fff; line-height: 1.3;
        }
        .detail-title-ur {
            font-size: 16px; color: rgba(255,255,255,0.75);
            direction: rtl; text-align: right;
            font-family: 'Noto Nastaliq Urdu','Segoe UI',sans-serif;
            line-height: 1.5; margin-top: 3px;
        }

        .avail-badge {
            font-size: 10px; font-weight: 700;
            padding: 3px 9px; border-radius: 10px;
            flex-shrink: 0;
        }
        .avail-badge.ok  { background: rgba(76,175,80,0.2); color: #81c784; border: 1px solid #4CAF5060; }
        .avail-badge.no  { background: rgba(244,67,54,0.2); color: #e57373; border: 1px solid #f4433660; }

        .detail-dept {
            font-size: 10px; color: #ffd54f;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 8px 18px 0;
        }

        .detail-section {
            padding: 14px 18px 6px;
        }
        .section-label {
            font-size: 10px; font-weight: 700;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase; letter-spacing: 0.7px;
            margin-bottom: 8px;
        }
        .section-label .ur-label {
            color: rgba(255,255,255,0.28);
            font-weight: 400; margin-left: 6px;
            direction: rtl;
            font-family: 'Noto Nastaliq Urdu','Segoe UI',sans-serif;
        }
        .summary-text {
            font-size: 13px; line-height: 1.6;
            color: rgba(255,255,255,0.78);
        }

        .fee-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 14px;
        }
        .fee-row {
            display: flex; align-items: baseline; gap: 6px;
            font-size: 12px; color: rgba(255,255,255,0.82);
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .fee-row:last-child { border-bottom: none; }
        .fee-dot { width: 5px; height: 5px; border-radius: 50%; background: #4CAF50; flex-shrink: 0; margin-top: 4px; }
        .fee-free { color: #81c784; font-weight: 600; }

        .doc-list { list-style: none; padding: 0; margin: 0; }
        .doc-item {
            display: flex; gap: 8px; align-items: flex-start;
            font-size: 12px; color: rgba(255,255,255,0.80);
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            line-height: 1.5;
        }
        .doc-item:last-child { border-bottom: none; }
        .doc-num {
            flex-shrink: 0; width: 20px; height: 20px;
            border-radius: 50%;
            background: rgba(76,175,80,0.2);
            color: #81c784; font-size: 10px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin-top: 1px;
        }

        .steps-list { display: flex; flex-direction: column; gap: 8px; }
        .step-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .step-num {
            flex-shrink: 0; width: 24px; height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4CAF50, #2e7d32);
            color: #fff; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .step-body { flex: 1; }
        .step-title {
            font-size: 11px; font-weight: 600;
            color: #ffd54f; margin-bottom: 3px;
        }
        .step-desc {
            font-size: 12px; color: rgba(255,255,255,0.75);
            line-height: 1.5;
        }
        .step-time {
            font-size: 10px; color: rgba(255,255,255,0.4);
            margin-top: 3px;
        }

        .duration-pill {
            display: inline-block;
            background: rgba(255,213,79,0.12);
            border: 1px solid rgba(255,213,79,0.3);
            color: #ffd54f;
            font-size: 12px; border-radius: 6px;
            padding: 5px 12px;
            margin-bottom: 4px;
        }

        .notes-list { list-style: none; padding: 0; margin: 0; }
        .note-item {
            font-size: 12px; color: rgba(255,255,255,0.6);
            padding: 4px 0 4px 14px;
            position: relative; line-height: 1.5;
        }
        .note-item::before {
            content: '•'; position: absolute; left: 0;
            color: #ffd54f;
        }

        .btn-ask-svc {
            display: block; width: calc(100% - 36px);
            margin: 14px 18px;
            padding: 12px;
            background: linear-gradient(135deg, #4CAF50, #2e7d32);
            color: #fff; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-ask-svc:hover { opacity: 0.88; }
        .btn-ask-svc.ur {
            direction: rtl;
            font-family: 'Noto Nastaliq Urdu','Segoe UI',sans-serif;
            font-size: 16px;
        }

        /* ═══ fixed subtitle bar (bottom, full width) ═══ */
        #subtitle-bar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 72px;
            background: rgba(0,0,0,0.78);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6px 28px;
            z-index: 200;
        }
        #sub-user {
            font-size: 13px;
            color: #6dd47e;
            min-height: 16px;
            line-height: 1.3;
            opacity: 0.95;
        }
        #sub-user .label { font-weight: 600; margin-right: 6px; }
        #sub-avatar {
            font-size: 19px;
            color: #fff;
            min-height: 24px;
            line-height: 1.3;
            margin-top: 2px;
            font-weight: 500;
        }
        .sub-rtl { direction: rtl; text-align: right; }

        /* ═══ loading overlay ═══ */
        #loading-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; color:#fff; font-size: 18px;
        }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>Loading Assistant…</div>
    </div>

    <div id="left-panel">
        <div id="avatar-container"></div>
        <div id="status">Connecting…</div>
        <div id="vad-meter"><div id="vad-bar"></div></div>
        <div id="controls">
            <button class="btn-new-session" id="btn-new-session" style="display:none">↺ New Session
            </button>
        </div>
    </div>

    <div id="services-panel">
        <!-- Breadcrumb -->
        <div id="wizard-crumb"></div>
        <!-- Step 1: Language -->
        <div id="step-lang" class="wizard-step"></div>
        <!-- Step 2: Department/Office -->
        <div id="step-dept" class="wizard-step" style="display:none"></div>
        <!-- Step 3: Service/Task list -->
        <div id="step-svc"  class="wizard-step" style="display:none"></div>
        <!-- Step 4: Service detail -->
        <div id="step-detail" class="wizard-step" style="display:none"></div>
        <!-- Session footer -->
        <div id="session-footer">
            <button id="btn-end-session">↺ End Session / نئی گفتگو</button>
        </div>
    </div>

    <div id="subtitle-bar">
        <div id="sub-user"><span class="label">You:</span><span id="sub-user-text"></span></div>
        <div id="sub-avatar"></div>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <!-- Three.js + TalkingHead import map -->
    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    } }
    </script>

    <script type="module">
    import { TalkingHead } from 'talkinghead';

    // ═══════════════════════════════════════════════════════════════════════
    // DOM refs
    // ═══════════════════════════════════════════════════════════════════════
    const statusEl     = document.getElementById('status');
    const vadMeter     = document.getElementById('vad-meter');
    const vadBar       = document.getElementById('vad-bar');
    const btnNewSession= document.getElementById('btn-new-session');
    const loadingEl    = document.getElementById('loading-overlay');
    const subUserText  = document.getElementById('sub-user-text');
    const subAvatarEl  = document.getElementById('sub-avatar');

    // ═══════════════════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════════════════
    let head          = null;
    let socket        = null;
    let vadActive     = false;
    let isSpeaking    = false;
    let audioQueue        = [];
    let processingQ       = false;
    let currentSpeakResolve = null;  // lets barge-in abort the current speakChunk immediately
    let uiLang        = 'en';   // 'en' | 'ur'   — tracks selected language

    // Wizard state
    let wizardLang    = null;   // null = Step 1 visible
    let wizardDept    = null;   // selected department object
    let sessionStarted = false; // true after first greeting finishes

    // VAD resources
    let audioCtx      = null;
    let micStream     = null;
    let micSource     = null;
    let scriptProc    = null;

    // VAD tuning
    const VAD_THRESHOLD   = 0.012;
    const SILENCE_MS      = 800;
    const CHUNK_SAMPLES   = 4096;
    const SAMPLE_RATE     = 16000;

    // Recording state
    let recording       = false;
    let recordedSamples = [];
    let silenceStart    = null;

    // Barge-in: ring buffer of last 8 RMS frames + cooldown to avoid double fire
    const BARGE_RING    = new Float32Array(8);
    let bargeRingIdx    = 0;
    let bargeCooldown   = false;     // 300ms after a barge-in fires
    const BARGE_MULT    = 2.5;       // median(ring) > VAD_THRESHOLD * BARGE_MULT

    function pushBargeFrame(rms) {
        BARGE_RING[bargeRingIdx] = rms;
        bargeRingIdx = (bargeRingIdx + 1) % BARGE_RING.length;
    }
    function bargeMedian() {
        const arr = Array.from(BARGE_RING).sort((a,b) => a-b);
        return arr[arr.length >> 1];
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Helpers
    // ═══════════════════════════════════════════════════════════════════════
    function setStatus(txt) { statusEl.textContent = txt; }
    function setListeningClass(on) { document.body.classList.toggle('listening', on); }

    function isUrdu(text) {
        if (!text) return false;
        let arabic = 0, alpha = 0;
        for (const c of text) {
            if (c >= '\u0600' && c <= '\u06FF') arabic++;
            if (/[a-zA-Z\u0600-\u06FF]/.test(c)) alpha++;
        }
        return alpha > 0 && (arabic / alpha) > 0.5;
    }

    function showUserSubtitle(text) {
        subUserText.textContent = text || '';
        subUserText.parentElement.classList.toggle('sub-rtl', isUrdu(text));
    }
    function showAvatarSubtitle(text) {
        subAvatarEl.textContent = text || '';
        subAvatarEl.classList.toggle('sub-rtl', isUrdu(text));
    }
    function clearAvatarSubtitle() { subAvatarEl.textContent = ''; }

    // ═══════════════════════════════════════════════════════════════════════
    // WAV encoding (PCM float32 → WAV ArrayBuffer)
    // ═══════════════════════════════════════════════════════════════════════
    function encodeWAV(samples, sampleRate) {
        const pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        const dataLen = pcm.byteLength;
        const buf = new ArrayBuffer(44 + dataLen);
        const view = new DataView(buf);
        const w  = (off, val, bytes) => {
            if (bytes === 4) view.setUint32(off, val, true);
            else if (bytes === 2) view.setUint16(off, val, true);
            else view.setUint8(off, val);
        };
        const ws = (off, str) => { for (let i=0; i<str.length; i++) view.setUint8(off+i, str.charCodeAt(i)); };
        ws(0, 'RIFF'); w(4, 36 + dataLen, 4); ws(8, 'WAVE');
        ws(12, 'fmt '); w(16, 16, 4); w(20, 1, 2); w(22, 1, 2);
        w(24, sampleRate, 4); w(28, sampleRate * 2, 4);
        w(32, 2, 2); w(34, 16, 2);
        ws(36, 'data'); w(40, dataLen, 4);
        new Int16Array(buf, 44).set(pcm);
        return buf;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VAD — energy-based, with ring-buffer barge-in
    // ═══════════════════════════════════════════════════════════════════════
    async function startVAD() {
        if (vadActive) return;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { sampleRate: SAMPLE_RATE, channelCount: 1,
                         echoCancellation: true, noiseSuppression: true },
                video: false
            });
        } catch (err) {
            setStatus('Mic denied: ' + err.message);
            return;
        }

        audioCtx   = new AudioContext({ sampleRate: SAMPLE_RATE });
        micSource  = audioCtx.createMediaStreamSource(micStream);
        scriptProc = audioCtx.createScriptProcessor(CHUNK_SAMPLES, 1, 1);

        micSource.connect(scriptProc);
        scriptProc.connect(audioCtx.destination);

        vadActive       = true;
        recording       = false;
        recordedSamples = [];
        silenceStart    = null;
        BARGE_RING.fill(0);

        vadMeter.style.display = 'block';

        scriptProc.onaudioprocess = (e) => {
            if (!vadActive) return;
            const input = e.inputBuffer.getChannelData(0);

            // RMS energy
            let sum = 0;
            for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
            const rms = Math.sqrt(sum / input.length);

            vadBar.style.width = Math.min(100, rms * 2000) + '%';

            // ── Barge-in: median over 8-frame ring buffer ────────────────────
            if (isSpeaking) {
                pushBargeFrame(rms);
                if (!bargeCooldown && bargeMedian() > VAD_THRESHOLD * BARGE_MULT) {
                    console.log('[VAD] barge-in (median=', bargeMedian().toFixed(4), ')');
                    bargeCooldown = true;
                    setTimeout(() => { bargeCooldown = false; }, 300);

                    socket.emit('barge_in');
                    head?.stopSpeaking?.();
                    // Resolve the pending speakChunk promise immediately
                    if (currentSpeakResolve) { currentSpeakResolve(); currentSpeakResolve = null; }
                    isSpeaking      = false;
                    audioQueue      = [];
                    processingQ     = false;
                    BARGE_RING.fill(0);
                    clearAvatarSubtitle();
                    setStatus('Listening…');
                    setListeningClass(true);
                    recording       = false;
                    recordedSamples = [];
                    silenceStart    = null;
                }
                return;  // don't record while speaking
            }

            // ── Normal VAD ────────────────────────────────────────────────────
            if (rms > VAD_THRESHOLD) {
                if (!recording) {
                    recording       = true;
                    recordedSamples = [];
                    setStatus('Listening…');
                    setListeningClass(true);
                }
                silenceStart = null;
                recordedSamples.push(new Float32Array(input));
            } else if (recording) {
                recordedSamples.push(new Float32Array(input));
                if (silenceStart === null) silenceStart = Date.now();
                if (Date.now() - silenceStart >= SILENCE_MS) {
                    recording = false;
                    setStatus('Transcribing…');
                    setListeningClass(false);
                    sendAudio();
                }
            }
        };

        setStatus('Listening…');
        setListeningClass(true);
    }

    function stopVAD() {
        vadActive = false;
        setListeningClass(false);
        vadMeter.style.display = 'none';
        vadBar.style.width = '0%';

        scriptProc?.disconnect();
        micSource?.disconnect();
        micStream?.getTracks().forEach(t => t.stop());
        scriptProc = null; micSource = null; micStream = null;
        if (audioCtx) { audioCtx.close(); audioCtx = null; }

        recording       = false;
        recordedSamples = [];
        silenceStart    = null;
    }

    function sendAudio() {
        if (recordedSamples.length === 0) return;
        const total = recordedSamples.reduce((s, a) => s + a.length, 0);
        const merged = new Float32Array(total);
        let offset = 0;
        for (const chunk of recordedSamples) { merged.set(chunk, offset); offset += chunk.length; }
        recordedSamples = [];
        const wavBuf = encodeWAV(merged, SAMPLE_RATE);
        socket.emit('audio_data', wavBuf);
        setStatus('Processing…');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Audio queue
    // ═══════════════════════════════════════════════════════════════════════
    async function drainQueue() {
        if (processingQ) return;
        processingQ = true;
        while (audioQueue.length > 0) {
            const item = audioQueue.shift();
            isSpeaking = true;
            setStatus('Speaking…');
            showAvatarSubtitle(item.text);
            if (item.audio && head) {
                await speakChunk(item);
            }
        }
        clearAvatarSubtitle();
        isSpeaking  = false;
        processingQ = false;
    }

    async function speakChunk(data) {
        try {
            const binary = atob(data.audio);
            const bytes  = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            const ctx = new AudioContext();
            const audioBuf = await ctx.decodeAudioData(bytes.buffer.slice(0));

            const lang = data.lang || 'en';
            const lipsyncLang = ['en','fi','lt'].includes(lang) ? lang : 'en';
            const words = adaptWords(data.words || [], lang);

            await new Promise(resolve => {
                const done = () => { currentSpeakResolve = null; resolve(); };
                currentSpeakResolve = done;
                try {
                    head.speakAudio(
                        { audio: audioBuf, words,
                          wtimes: data.wtimes || [], wdurations: data.wdurations || [] },
                        { lipsyncLang },
                        done
                    );
                    setTimeout(done, (audioBuf.duration * 1000) + 600);
                } catch { done(); }
            });
            await ctx.close();
        } catch (err) {
            console.error('[speakChunk] error:', err);
        }
    }

    function adaptWords(words, lang) {
        if (['en','fi','lt'].includes(lang)) return words;
        return words.map(w => {
            if (/^[a-zA-Z]+$/.test(w)) return w;
            const n = Math.max(1, Math.ceil(w.length / 3));
            const pats = ['ba','da','ma','la','na'];
            return Array.from({length: n}, (_,i) => pats[i % pats.length]).join('');
        });
    }

    // ── Wizard navigation ────────────────────────────────────────────────────
    function showStep(step) {
        ['lang','dept','svc','detail'].forEach(s => {
            const el = document.getElementById(`step-${s}`);
            if (el) el.style.display = s === step ? '' : 'none';
        });
        updateCrumb(step);
    }

    function updateCrumb(currentStep) {
        const crumb = document.getElementById('wizard-crumb');
        const parts = [];

        if (wizardLang) {
            parts.push({ label: wizardLang === 'ur' ? 'اردو' : 'English',
                          step: 'lang', clickable: true });
        }
        if (wizardDept) {
            parts.push({ label: wizardDept.code || wizardDept.name,
                          step: 'dept', clickable: true });
        }
        if (currentStep === 'detail') {
            parts.push({ label: L().step3, step: 'svc', clickable: true });
        }

        let html = '';
        const stepTitleMap = { lang: L().step1, dept: L().step2, svc: L().step3, detail: 'Info' };
        const currentLabel = stepTitleMap[currentStep] || '';

        if (parts.length === 0) {
            html = `<span class="crumb-current">${escapeHtml(currentLabel)}</span>`;
        } else {
            for (let i = 0; i < parts.length; i++) {
                const p = parts[i];
                html += `<button class="crumb-btn" data-step="${escapeHtml(p.step)}">${escapeHtml(p.label)}</button>`;
                html += `<span class="crumb-sep">›</span>`;
            }
            html += `<span class="crumb-current">${escapeHtml(currentLabel)}</span>`;
        }
        crumb.innerHTML = html;
        crumb.querySelectorAll('.crumb-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.step;
                if (target === 'lang') { wizardLang = null; wizardDept = null; initWizard(); }
                else if (target === 'dept') { wizardDept = null; renderDeptStep(); showStep('dept'); }
                else if (target === 'svc') { renderSvcStep(); showStep('svc'); }
            });
        });
    }

    function initWizard() {
        renderLangStep();
        showStep('lang');
    }

                <button class="lang-card-btn" data-lang="ur">
                    <span class="lang-flag">🇵🇰</span>
                    <span class="lang-card-label ur-label">اردو</span>
                    <span class="lang-card-sub">Urdu</span>

    // ── Step 2: Department ────────────────────────────────────────────────────
    function renderDeptStep() {
        const el   = document.getElementById('step-dept');
        const depts = CATALOG.departments || [];
        let html = '<div class="dept-grid">';
        for (const d of depts) {
            const count = (CATALOG.services || []).filter(
                s => (s.department || {}).id === d.id
            ).length;
            html += `<button class="dept-card" data-id="${escapeHtml(d.id)}">
                <div class="dept-card-left">
                    <div class="dept-card-name">${escapeHtml(d.name)}</div>
                    <div class="dept-card-code">${escapeHtml(d.code || '')}</div>
                </div>
                <span class="dept-card-count">${count}</span>
                <span class="dept-card-arrow">›</span>
            </button>`;
        }
        html += '</div>';
        el.innerHTML = html;
        el.querySelectorAll('.dept-card').forEach(btn => {
            btn.addEventListener('click', () => {
                wizardDept = (CATALOG.departments || []).find(d => d.id === btn.dataset.id);
                if (!wizardDept) return;
                renderSvcStep();
                showStep('svc');
            });
        });
    }

    // ── Step 3: Service list ──────────────────────────────────────────────────
    function renderSvcStep() {
        const el  = document.getElementById('step-svc');
        const svcs = (CATALOG.services || []).filter(
            s => wizardDept && (s.department || {}).id === wizardDept.id
        );
        if (!svcs.length) {
            el.innerHTML = `<div style="padding:22px;color:rgba(255,255,255,0.45);font-size:13px">${L().noInfo}</div>`;
            return;
        }
        let html = '<div class="svc-list">';
        for (const svc of svcs) {
            const nameObj = svc.service_name || {};
            const name = (uiLang === 'ur' && nameObj.ur) ? nameObj.ur : (nameObj.en || svc.service_id);
            const unavail = svc.availability_status === 'not_available_at_center';
            const fee = feeText(svc);
            html += `<button class="svc-item${unavail ? ' unavailable' : ''}" data-id="${escapeHtml(svc.service_id)}">
                <div class="svc-item-name${uiLang === 'ur' && nameObj.ur ? ' ur-text' : ''}">${escapeHtml(name)}</div>
                ${fee ? `<div class="svc-item-fee">${escapeHtml(fee)}</div>` : ''}
                ${unavail ? `<div class="svc-item-na">${L().unavailable}</div>` : ''}
            </button>`;
        }
        html += '</div>';
        el.innerHTML = html;
        el.querySelectorAll('.svc-item:not(.unavailable)').forEach(btn => {
            btn.addEventListener('click', () => {
                const svc = (CATALOG.services || []).find(s => s.service_id === btn.dataset.id);
                if (!svc) return;
                renderDetailStep(svc);
                showStep('detail');
            });
        });
    }

    // ── Step 4: Detail ────────────────────────────────────────────────────────
    // renderDetailStep: builds UI AND emits service_navigated (card-click path)
    function renderDetailStep(svc) {
        _showServiceDetail(svc);
        // Notify server: user navigated to this service — speak its summary
        if (socket && socket.connected) {
            socket.emit('service_navigated', { serviceId: svc.service_id });
        }
    }

    // _showServiceDetail: UI only, no server event (used by navigate_panel handler)
    function _showServiceDetail(svc) {
        const el       = document.getElementById('step-detail');
        const nameObj  = svc.service_name || {};
        const nameEn   = nameObj.en || svc.service_id;
        const nameUr   = nameObj.ur || '';
        const isAvail  = svc.availability_status !== 'not_available_at_center';
        const pay      = svc.payment_model || {};
        const docs     = svc.required_documents || [];
        const stages   = svc.process_stages || [];
        const duration = svc.duration_model || {};
        const notes    = svc.notes || [];
        const deptName = (svc.department || {}).name || '';
        const lbl      = L();

        let html = `
        <div class="detail-top">
            <button class="btn-back" id="btn-back-detail">&#8592;</button>
            <div class="detail-title-wrap">
                <div class="detail-title-en">${escapeHtml(nameEn)}</div>
                ${nameUr ? `<div class="detail-title-ur">${escapeHtml(nameUr)}</div>` : ''}
            </div>
            <span class="avail-badge ${isAvail ? 'ok' : 'no'}">${isAvail ? lbl.available : lbl.unavailable}</span>
        </div>
        ${deptName ? `<div class="detail-dept">${escapeHtml(deptName)}</div>` : ''}`;

        if (svc.summary) {
            const short = svc.summary.replace(/\s*List of required documents\s*$/i, '').trim();
            html += `<div class="detail-section">
                <div class="section-label">${lbl.summary}</div>
                <div class="summary-text">${escapeHtml(short)}</div>
            </div>`;
        }

        // Fee
        html += `<div class="detail-section"><div class="section-label">${lbl.fee}</div><div class="fee-box">`;
        if (pay.type === 'free') {
            html += `<div class="fee-row"><span class="fee-dot"></span><span class="fee-free">${lbl.free}</span></div>`;
            for (const e of (pay.entries || []))
                html += `<div class="fee-row"><span class="fee-dot"></span>${escapeHtml(e)}</div>`;
        } else {
            const entries = pay.entries || [];
            if (entries.length) {
                for (const e of entries) html += `<div class="fee-row"><span class="fee-dot"></span>${escapeHtml(e)}</div>`;
            } else {
                html += `<div class="fee-row" style="color:rgba(255,255,255,0.4)">—</div>`;
            }
        }
        html += `</div></div>`;

        // Documents
        if (docs.length) {
            html += `<div class="detail-section"><div class="section-label">${lbl.docs}</div><ul class="doc-list">`;
            docs.forEach((d, i) => {
                const txt = typeof d === 'string' ? d : d.text || '';
                html += `<li class="doc-item"><span class="doc-num">${i + 1}</span><span>${escapeHtml(txt)}</span></li>`;
            });
            html += `</ul></div>`;
        }

        // Process stages
        if (stages.length) {
            html += `<div class="detail-section"><div class="section-label">${lbl.steps}</div><div class="steps-list">`;
            for (const s of stages) {
                html += `<div class="step-card">
                    <div class="step-num">${s.stage_no}</div>
                    <div class="step-body">
                        <div class="step-title">${escapeHtml(s.title || `Stage ${s.stage_no}`)}</div>
                        <div class="step-desc">${escapeHtml(s.description || '')}</div>
                        ${s.expected_time ? `<div class="step-time">⏱ ${escapeHtml(s.expected_time)}</div>` : ''}
                    </div>
                </div>`;
            }
            html += `</div></div>`;
        }

        // Duration
        const durEntries = duration.entries || [];
        if (durEntries.length) {
            html += `<div class="detail-section"><div class="section-label">${lbl.duration}</div>
                ${durEntries.map(e => `<span class="duration-pill">⏱ ${escapeHtml(e)}</span>`).join(' ')}
            </div>`;
        }

        // Notes
        if (notes.length) {
            html += `<div class="detail-section"><div class="section-label">${lbl.notes}</div><ul class="notes-list">`;
            for (const n of notes) html += `<li class="note-item">${escapeHtml(n)}</li>`;
            html += `</ul></div>`;
        }

        // Ask avatar button
        if (isAvail) {
            html += `<button class="btn-ask-svc${uiLang === 'ur' ? ' ur' : ''}" id="btn-ask-svc">
                ${escapeHtml(lbl.ask)}
            </button>`;
        }

        el.innerHTML = html;
        el.scrollTop = 0;

        document.getElementById('btn-back-detail').addEventListener('click', () => {
            renderSvcStep();
            showStep('svc');
        });

        const askBtn = document.getElementById('btn-ask-svc');
        if (askBtn) {
            askBtn.addEventListener('click', () => {
                if (!socket || !socket.connected) return;
                askBtn.style.opacity = '0.5';
                showUserSubtitle(nameEn);
                socket.emit('service_selected', { serviceId: svc.service_id, lang: uiLang });
                setTimeout(() => { askBtn.style.opacity = ''; }, 600);
            });
        }
    }

    // ── Fee text helper ───────────────────────────────────────────────────────
    function feeText(svc) {
        const pay = svc.payment_model || {};
        if (pay.type === 'free') return uiLang === 'ur' ? 'مفت' : 'Free';
        const entries = pay.entries || [];
        return entries.length ? entries[0] : '';
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Session reset
    // ═══════════════════════════════════════════════════════════════════════
    async function resetSession() {
        stopVAD();
        if (head) head.stopSpeaking?.();
        isSpeaking   = false;
        audioQueue   = [];
        processingQ  = false;
        sessionStarted = false;
        clearAvatarSubtitle();
        showUserSubtitle('');

        // Tell server to clear conversation memory
        if (socket && socket.connected) socket.emit('reset_session');

        // Reset wizard to Step 1
        wizardLang = null;
        wizardDept = null;
        uiLang     = 'en';
        initWizard();

        // Hide the session button until next greeting finishes
        btnNewSession.style.display = 'none';

        // Request new greeting then restart VAD
        if (socket && socket.connected) socket.emit('request_greeting');
        setStatus('Ready');
        await startVAD();
    }

    btnNewSession.addEventListener('click', resetSession);
    document.getElementById('btn-end-session').addEventListener('click', resetSession);

    // ═══════════════════════════════════════════════════════════════════════
    // Socket.IO
    // ═══════════════════════════════════════════════════════════════════════
    function initSocket() {
        socket = io(window.location.origin);

        socket.on('connect', () => {
            setStatus('Connected');
        });

        socket.on('server_profile', () => {
            socket.emit('request_greeting');
        });

        socket.on('status', (d) => {
            const map = {
                connected: 'Ready', thinking: 'Thinking…',
                processing: 'Processing…', speaking: 'Speaking…',
                error: 'Error', listening: 'Listening…'
            };
            setStatus(map[d.state] || d.message || d.state);
        });

        socket.on('user_text', (d) => {
            showUserSubtitle(d.text || '');
        });

        socket.on('speak_chunk', (d) => {
            audioQueue.push(d);
            drainQueue();
        });

        socket.on('speak_done', (d) => {
            d = d || {};
            // Show new-session button once the avatar has spoken at least once
            if (!sessionStarted) {
                sessionStarted = true;
                btnNewSession.style.display = 'inline-block';
            }

            // Server requested full session reset (user said goodbye/no thanks)
            if (d.resetSession) {
                const waitAndReset = () => {
                    if (processingQ || isSpeaking) { setTimeout(waitAndReset, 200); return; }
                    resetSession();
                };
                waitAndReset();
                return;
            }

            const waitForQueueAndResume = () => {
                if (processingQ || isSpeaking) {
                    setTimeout(waitForQueueAndResume, 200);
                    return;
                }
                if (vadActive) {
                    setStatus('Listening…');
                    setListeningClass(true);
                }
            };
            waitForQueueAndResume();
        });

        // Server wants client to navigate the wizard to a service detail page
        // NOTE: we use _showServiceDetail here (NOT renderDetailStep) to avoid
        // emitting service_navigated back to the server and creating a feedback loop.
        socket.on('navigate_panel', (d) => {
            const svcId = (d || {}).serviceId;
            if (!svcId) return;
            const svc = (CATALOG.services || []).find(s => s.service_id === svcId);
            if (!svc) return;
            const dept = (CATALOG.departments || []).find(
                dep => dep.id === (svc.department || {}).id
            );
            if (dept) wizardDept = dept;
            _showServiceDetail(svc);   // UI only — no server roundtrip
            showStep('detail');
        });

        socket.on('cannot_hear', () => {
            showAvatarSubtitle(uiLang === 'ur'
                ? 'معذرت، آواز واضح نہیں آئی۔ دوبارہ کوشش کریں۔'
                : "Sorry, I couldn't hear that. Please try again.");
            setStatus('Listening…');
            setListeningClass(vadActive);
        });

        socket.on('disconnect', () => {
            setStatus('Disconnected');
            stopVAD();
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Avatar init
    // ═══════════════════════════════════════════════════════════════════════
    async function initAvatar() {
        const avatarUrl      = "{{ avatar_url }}";
        const avatarFallback = "{{ avatar_fallback }}";

        head = new TalkingHead(document.getElementById('avatar-container'), {
            cameraView: 'upper',
            cameraRotateEnable: true,
            lipsyncModules: ['en'],
            lipsyncLang: 'en'
        });

        let ok = false;
        try {
            await head.showAvatar({ url: avatarUrl, body: 'F',
                                    avatarMood: 'neutral', lipsyncLang: 'en' });
            ok = true;
        } catch { /* fallback */ }

        if (!ok) {
            await head.showAvatar({ url: avatarFallback, body: 'F',
                                    avatarMood: 'neutral', lipsyncLang: 'en' });
        }

        loadingEl.style.display = 'none';
        setStatus('Ready');
        // Kiosk mode: auto-start mic + VAD (no button needed)
        await startVAD();
    }

    // (kiosk mode — VAD auto-starts in initAvatar; session reset via resetSession())

    // ═══════════════════════════════════════════════════════════════════════
    // Boot
    // ═══════════════════════════════════════════════════════════════════════
    initSocket();
    loadCatalog();
    try {
        await initAvatar();
    } catch (err) {
        loadingEl.innerHTML = `<div style="color:#f44;text-align:center;padding:20px">
            Avatar failed to load.<br><small>${err.message}</small></div>`;
        console.error('Avatar init error:', err);
    }
    </script>
</body>
</html>
