<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAK Center Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh; width: 100vw;
            display: flex;
        }

        /* ─── left panel ─── */
        #left-panel { flex: 1; position: relative; height: 100vh; }
        #avatar-container { width: 100%; height: 100%; }

        #status {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 18px;
            padding: 8px 24px;
            background: rgba(0,0,0,0.55);
            border-radius: 30px; z-index: 100;
            backdrop-filter: blur(10px); white-space: nowrap;
        }
        body.listening #status {
            animation: pulse 1.5s infinite;
            background: rgba(76,175,80,0.4);
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
            50%      { box-shadow: 0 0 0 14px rgba(76,175,80,0); }
        }

        #vad-meter {
            position: absolute; top: 64px; left: 50%;
            transform: translateX(-50%);
            width: 200px; height: 6px;
            background: rgba(255,255,255,0.12);
            border-radius: 3px; z-index: 100; overflow: hidden;
            display: none;
        }
        #vad-bar {
            height: 100%; width: 0%;
            background: #4CAF50;
            border-radius: 3px;
            transition: width 0.05s;
        }

        #subtitle {
            position: absolute; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 20px;
            padding: 10px 28px;
            background: rgba(0,0,0,0.65);
            border-radius: 12px; z-index: 100;
            max-width: 80%; text-align: center;
            display: none; backdrop-filter: blur(6px);
        }

        #controls {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); z-index: 100;
            display: flex; gap: 12px;
        }
        .btn {
            padding: 14px 36px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn-start { background: linear-gradient(135deg,#4CAF50,#45a049); color:#fff; }
        .btn-stop  { background: linear-gradient(135deg,#f44336,#d32f2f); color:#fff; display:none; }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ─── right chat panel ─── */
        #chat-panel {
            width: 380px; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
        }
        #chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 18px; font-weight: 600;
            text-align: center;
        }
        #chat-messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .msg {
            max-width: 90%; padding: 10px 16px; border-radius: 16px;
            font-size: 14px; line-height: 1.5;
            animation: slideIn 0.3s ease; word-wrap: break-word;
        }
        .msg-user      { align-self: flex-end;   background: #4CAF50; color:#fff; border-bottom-right-radius: 4px; }
        .msg-assistant { align-self: flex-start; background: rgba(255,255,255,0.12); color:#e0e0e0; border-bottom-left-radius: 4px; }
        .msg-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 2px; font-weight: 500; }
        .msg-label-user { text-align: right; }
        .msg-system {
            align-self: center;
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
            font-size: 12px; padding: 6px 14px; border-radius: 12px; font-style: italic;
        }

        @keyframes slideIn {
            from { opacity:0; transform:translateY(8px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ─── loading overlay ─── */
        #loading-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; color:#fff; font-size: 20px;
        }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>Loading Assistant…</div>
    </div>

    <div id="left-panel">
        <div id="avatar-container"></div>
        <div id="status">Connecting…</div>
        <div id="vad-meter"><div id="vad-bar"></div></div>
        <div id="subtitle"></div>
        <div id="controls">
            <button class="btn btn-start" id="btn-start" disabled>Start Conversation</button>
            <button class="btn btn-stop"  id="btn-stop">Stop</button>
        </div>
    </div>

    <div id="chat-panel">
        <div id="chat-header">{{ avatar_name }}</div>
        <div id="chat-messages"></div>
    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <!-- Three.js + TalkingHead import map -->
    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    } }
    </script>

    <script type="module">
    import { TalkingHead } from 'talkinghead';

    // ═══════════════════════════════════════════════════════════════════════
    // DOM refs
    // ═══════════════════════════════════════════════════════════════════════
    const statusEl   = document.getElementById('status');
    const subtitleEl = document.getElementById('subtitle');
    const vadMeter   = document.getElementById('vad-meter');
    const vadBar     = document.getElementById('vad-bar');
    const btnStart   = document.getElementById('btn-start');
    const btnStop    = document.getElementById('btn-stop');
    const chatMsgs   = document.getElementById('chat-messages');
    const loadingEl  = document.getElementById('loading-overlay');

    // ═══════════════════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════════════════
    let head          = null;   // TalkingHead instance
    let socket        = null;
    let vadActive     = false;  // VAD loop running?
    let isSpeaking    = false;  // avatar speaking?
    let audioQueue    = [];     // pending speak_chunk items
    let processingQ   = false;  // queue being drained?

    // VAD resources
    let audioCtx      = null;
    let micStream     = null;
    let micSource     = null;
    let scriptProc    = null;

    // VAD tuning
    const VAD_THRESHOLD   = 0.012;   // RMS energy to start recording
    const SILENCE_MS      = 800;     // ms of silence to end utterance
    const CHUNK_SAMPLES   = 4096;    // ScriptProcessor buffer size
    const SAMPLE_RATE     = 16000;   // whisper target

    // Recording state
    let recording       = false;
    let recordedSamples = [];
    let silenceStart    = null;

    // ═══════════════════════════════════════════════════════════════════════
    // Helpers
    // ═══════════════════════════════════════════════════════════════════════
    function setStatus(txt) { statusEl.textContent = txt; }

    function setListeningClass(on) {
        document.body.classList.toggle('listening', on);
    }

    function addChat(text, isUser) {
        const labelEl = document.createElement('div');
        labelEl.className = 'msg-label ' + (isUser ? 'msg-label-user' : '');
        labelEl.textContent = isUser ? 'You' : '{{ avatar_name }}';

        const msgEl = document.createElement('div');
        msgEl.className = 'msg ' + (isUser ? 'msg-user' : 'msg-assistant');
        msgEl.textContent = text;

        chatMsgs.appendChild(labelEl);
        chatMsgs.appendChild(msgEl);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    function addSystem(text) {
        const el = document.createElement('div');
        el.className = 'msg-system';
        el.textContent = text;
        chatMsgs.appendChild(el);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    function showSubtitle(text) {
        subtitleEl.textContent = text;
        subtitleEl.style.display = 'block';
    }
    function hideSubtitle() { subtitleEl.style.display = 'none'; }

    // ═══════════════════════════════════════════════════════════════════════
    // WAV encoding (PCM float32 → WAV ArrayBuffer)
    // ═══════════════════════════════════════════════════════════════════════
    function encodeWAV(samples, sampleRate) {
        // Convert float32 to int16
        const pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        const dataLen = pcm.byteLength;
        const buf = new ArrayBuffer(44 + dataLen);
        const view = new DataView(buf);

        const w = (off, val, bytes) => {
            if (bytes === 4) view.setUint32(off, val, true);
            else if (bytes === 2) view.setUint16(off, val, true);
            else view.setUint8(off, val);
        };
        const ws = (off, str) => { for (let i=0; i<str.length; i++) view.setUint8(off+i, str.charCodeAt(i)); };

        ws(0, 'RIFF');
        w(4, 36 + dataLen, 4);
        ws(8, 'WAVE');
        ws(12, 'fmt ');
        w(16, 16, 4);          // chunk size
        w(20, 1, 2);           // PCM
        w(22, 1, 2);           // mono
        w(24, sampleRate, 4);
        w(28, sampleRate * 2, 4); // byte rate
        w(32, 2, 2);           // block align
        w(34, 16, 2);          // bits per sample
        ws(36, 'data');
        w(40, dataLen, 4);

        new Int16Array(buf, 44).set(pcm);
        return buf;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VAD — energy-based voice activity detection in the browser
    // ═══════════════════════════════════════════════════════════════════════
    async function startVAD() {
        if (vadActive) return;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }, video: false });
        } catch (err) {
            addSystem('Microphone access denied: ' + err.message);
            return;
        }

        audioCtx  = new AudioContext({ sampleRate: SAMPLE_RATE });
        micSource = audioCtx.createMediaStreamSource(micStream);
        scriptProc = audioCtx.createScriptProcessor(CHUNK_SAMPLES, 1, 1);

        micSource.connect(scriptProc);
        scriptProc.connect(audioCtx.destination);

        vadActive     = true;
        recording     = false;
        recordedSamples = [];
        silenceStart  = null;

        vadMeter.style.display = 'block';

        scriptProc.onaudioprocess = (e) => {
            if (!vadActive) return;
            const input = e.inputBuffer.getChannelData(0);

            // RMS energy
            let sum = 0;
            for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
            const rms = Math.sqrt(sum / input.length);

            // Update meter
            vadBar.style.width = Math.min(100, rms * 2000) + '%';

            if (isSpeaking) {
                // Barge-in: user speaks loudly while avatar is talking
                if (rms > VAD_THRESHOLD * 2.5) {
                    console.log('[VAD] barge-in detected');
                    socket.emit('barge_in');
                    head?.stopSpeaking?.();
                    isSpeaking    = false;
                    audioQueue    = [];
                    processingQ   = false;
                    hideSubtitle();
                    setStatus('Listening…');
                    setListeningClass(true);
                    recording     = false;
                    recordedSamples = [];
                    silenceStart  = null;
                }
                return;  // don't record while speaking unless barge-in triggered
            }

            if (rms > VAD_THRESHOLD) {
                // Voice detected
                if (!recording) {
                    recording     = true;
                    recordedSamples = [];
                    setStatus('Listening…');
                    setListeningClass(true);
                    console.log('[VAD] speech start');
                }
                silenceStart = null;
                // Accumulate samples (copy, not reference)
                recordedSamples.push(new Float32Array(input));

            } else if (recording) {
                // Silence during recording
                recordedSamples.push(new Float32Array(input));
                if (silenceStart === null) silenceStart = Date.now();
                if (Date.now() - silenceStart >= SILENCE_MS) {
                    // End of utterance
                    recording = false;
                    setStatus('Transcribing…');
                    setListeningClass(false);
                    console.log('[VAD] speech end, chunks:', recordedSamples.length);
                    sendAudio();
                }
            }
        };

        setStatus('Listening…');
        setListeningClass(true);
    }

    function stopVAD() {
        vadActive = false;
        setListeningClass(false);
        vadMeter.style.display = 'none';
        vadBar.style.width = '0%';

        scriptProc?.disconnect();
        micSource?.disconnect();
        micStream?.getTracks().forEach(t => t.stop());

        scriptProc = null; micSource = null; micStream = null;
        if (audioCtx) { audioCtx.close(); audioCtx = null; }

        recording     = false;
        recordedSamples = [];
        silenceStart  = null;
    }

    function sendAudio() {
        if (recordedSamples.length === 0) return;

        // Flatten Float32Array[]
        const total = recordedSamples.reduce((s, a) => s + a.length, 0);
        const merged = new Float32Array(total);
        let offset = 0;
        for (const chunk of recordedSamples) {
            merged.set(chunk, offset);
            offset += chunk.length;
        }
        recordedSamples = [];

        const wavBuf = encodeWAV(merged, SAMPLE_RATE);
        socket.emit('audio_data', wavBuf);
        setStatus('Processing…');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Audio queue — plays speak_chunk items sequentially
    // ═══════════════════════════════════════════════════════════════════════
    async function drainQueue() {
        if (processingQ) return;
        processingQ = true;

        while (audioQueue.length > 0) {
            const item = audioQueue.shift();
            isSpeaking = true;
            setStatus('Speaking…');
            addChat(item.text, false);
            showSubtitle(item.text);

            if (item.audio && head) {
                await speakChunk(item);
            }
            hideSubtitle();
        }

        isSpeaking = false;
        processingQ = false;
    }

    async function speakChunk(data) {
        try {
            const binary = atob(data.audio);
            const bytes  = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            // Need a running AudioContext to decode
            const ctx = new AudioContext();
            const audioBuf = await ctx.decodeAudioData(bytes.buffer.slice(0));

            const lang = data.lang || 'en';
            const lipsyncLang = ['en','fi','lt'].includes(lang) ? lang : 'en';
            const words = adaptWords(data.words || [], lang);

            await new Promise(resolve => {
                try {
                    head.speakAudio(
                        { audio: audioBuf, words, wtimes: data.wtimes || [], wdurations: data.wdurations || [] },
                        { lipsyncLang },
                        resolve
                    );
                    // Safety timeout: resolve after audio duration + 500ms
                    setTimeout(resolve, (audioBuf.duration * 1000) + 600);
                } catch {
                    resolve();
                }
            });
            await ctx.close();
        } catch (err) {
            console.error('[speakChunk] error:', err);
        }
    }

    // Urdu / non-Latin: approximate mouth shape with phonetic syllables
    function adaptWords(words, lang) {
        if (['en','fi','lt'].includes(lang)) return words;
        return words.map(w => {
            if (/^[a-zA-Z]+$/.test(w)) return w;
            const n = Math.max(1, Math.ceil(w.length / 3));
            const pats = ['ba','da','ma','la','na'];
            return Array.from({length: n}, (_,i) => pats[i % pats.length]).join('');
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Socket.IO
    // ═══════════════════════════════════════════════════════════════════════
    function initSocket() {
        socket = io(window.location.origin);

        socket.on('connect', () => {
            addSystem('Connected to server');
        });

        socket.on('server_profile', () => {
            // Greeting is triggered from the UI (Start button or auto after load)
            socket.emit('request_greeting');
        });

        socket.on('status', (d) => {
            const map = {
                connected: 'Ready', thinking: 'Thinking…',
                processing: 'Processing…', speaking: 'Speaking…',
                error: 'Error', listening: 'Listening…'
            };
            setStatus(map[d.state] || d.message || d.state);
        });

        socket.on('user_text', (d) => {
            addChat(d.text, true);
        });

        socket.on('speak_chunk', (d) => {
            audioQueue.push(d);
            drainQueue();
        });

        socket.on('speak_done', () => {
            // After queue drains, resume VAD listening
            const waitForQueueAndResume = () => {
                if (processingQ || isSpeaking) {
                    setTimeout(waitForQueueAndResume, 200);
                    return;
                }
                if (vadActive) {
                    setStatus('Listening…');
                    setListeningClass(true);
                }
            };
            waitForQueueAndResume();
        });

        socket.on('cannot_hear', () => {
            addSystem("Couldn't hear you clearly — please try again");
            setStatus('Listening…');
            setListeningClass(vadActive);
        });

        socket.on('disconnect', () => {
            addSystem('Disconnected from server');
            setStatus('Disconnected');
            stopVAD();
        });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Avatar init
    // ═══════════════════════════════════════════════════════════════════════
    async function initAvatar() {
        const avatarUrl      = "{{ avatar_url }}";
        const avatarFallback = "{{ avatar_fallback }}";

        head = new TalkingHead(document.getElementById('avatar-container'), {
            cameraView: 'upper',
            cameraRotateEnable: true,
            lipsyncModules: ['en'],
            lipsyncLang: 'en'
        });

        let ok = false;
        try {
            await head.showAvatar({ url: avatarUrl, body: 'F', avatarMood: 'neutral', lipsyncLang: 'en' });
            ok = true;
        } catch { /* try fallback */ }

        if (!ok) {
            await head.showAvatar({ url: avatarFallback, body: 'F', avatarMood: 'neutral', lipsyncLang: 'en' });
        }

        loadingEl.style.display = 'none';
        setStatus('Ready — click Start');
        btnStart.disabled = false;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // Button handlers
    // ═══════════════════════════════════════════════════════════════════════
    btnStart.addEventListener('click', async () => {
        btnStart.style.display = 'none';
        btnStop.style.display  = 'inline-block';
        await startVAD();
    });

    btnStop.addEventListener('click', () => {
        stopVAD();
        btnStop.style.display  = 'none';
        btnStart.style.display = 'inline-block';
        setStatus('Stopped');
        isSpeaking  = false;
        audioQueue  = [];
        processingQ = false;
        hideSubtitle();
    });

    // ═══════════════════════════════════════════════════════════════════════
    // Boot
    // ═══════════════════════════════════════════════════════════════════════
    initSocket();
    try {
        await initAvatar();
    } catch (err) {
        loadingEl.innerHTML = `<div style="color:#f44;text-align:center;padding:20px">
            Avatar failed to load.<br><small>${err.message}</small></div>`;
        console.error('Avatar init error:', err);
    }

    </script>
</body>
</html>
