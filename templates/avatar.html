<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF QnA Avatar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
        }

        #left-panel { flex: 1; position: relative; height: 100vh; }
        #avatar-container { width: 100%; height: 100%; }

        #status {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 18px;
            padding: 8px 24px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px; z-index: 100;
            backdrop-filter: blur(10px); white-space: nowrap;
        }

        #controls {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); z-index: 100;
            display: flex; gap: 12px;
        }
        .btn {
            padding: 14px 36px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .btn-start { background: linear-gradient(135deg, #4CAF50, #45a049); color: white; }
        .btn-start:hover { transform: scale(1.05); }
        .btn-stop  { background: linear-gradient(135deg, #f44336, #d32f2f); color: white; display: none; }
        .btn-stop:hover { transform: scale(1.05); }

        #chat-panel {
            width: 380px; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
        }
        #chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 18px; font-weight: 600;
            text-align: center;
        }
        #chat-messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .msg {
            max-width: 90%; padding: 10px 16px; border-radius: 16px;
            font-size: 14px; line-height: 1.5;
            animation: slideIn 0.3s ease; word-wrap: break-word;
        }
        .msg-user      { align-self: flex-end;   background: #4CAF50; color: white; border-bottom-right-radius: 4px; }
        .msg-assistant { align-self: flex-start; background: rgba(255,255,255,0.12); color: #e0e0e0; border-bottom-left-radius: 4px; }
        .msg-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 2px; font-weight: 500; }
        .msg-label-user { text-align: right; }
        .msg-label-assistant { text-align: left; }
        .msg-system {
            align-self: center; background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5); font-size: 12px;
            padding: 6px 14px; border-radius: 12px; font-style: italic;
        }

        #subtitle {
            position: absolute; bottom: 90px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 20px;
            padding: 10px 28px;
            background: rgba(0,0,0,0.65);
            border-radius: 12px; z-index: 100;
            max-width: 80%; text-align: center;
            display: none; backdrop-filter: blur(6px);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .listening #status { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
            50%     { box-shadow: 0 0 0 12px rgba(76,175,80,0); }
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000; color: white; font-size: 20px;
        }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #tts-badge {
            position: absolute; top: 60px; left: 50%;
            transform: translateX(-50%);
            font-size: 11px; padding: 4px 12px;
            border-radius: 12px; z-index: 100; opacity: 0.7;
            background: #0078d4; color: #fff;
        }

        #debug-panel {
            position: fixed; bottom: 0; left: 0;
            width: 100%; max-height: 200px;
            display: none; overflow-y: auto;
            background: rgba(0,0,0,0.92); color: #0f0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px; padding: 8px 12px;
            z-index: 9999; border-top: 1px solid #333;
        }
        #debug-panel .dbg-err  { color: #f55; }
        #debug-panel .dbg-warn { color: #fa0; }
        #debug-panel .dbg-info { color: #0af; }
        #debug-toggle {
            position: fixed; top: 10px; right: 10px;
            z-index: 10000;
            background: #333; color: #fff;
            border: none; padding: 4px 10px;
            border-radius: 4px; cursor: pointer; font-size: 11px;
        }
    </style>
</head>
<body>
    <button id="debug-toggle" onclick="document.getElementById('debug-panel').style.display = document.getElementById('debug-panel').style.display === 'none' ? 'block' : 'none'">Toggle Debug</button>
    <div id="debug-panel"></div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>Loading 3D Avatar...</div>
    </div>

    <div id="left-panel">
        <div id="avatar-container"></div>
        <div id="status">Ready</div>
        <div id="tts-badge">Gemini / Edge TTS</div>
        <div id="subtitle"></div>
        <div id="controls">
            <button class="btn btn-start" id="btn-start">Start Conversation</button>
            <button class="btn btn-stop"  id="btn-stop">Stop</button>
        </div>
    </div>

    <div id="chat-panel">
        <div id="chat-header">PDF QnA Assistant</div>
        <div id="chat-messages"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <script type="importmap">
    { "imports":
      {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
      }
    }
    </script>

    <script type="module">
        import { TalkingHead } from 'talkinghead';

        // ============================================================
        // DEBUG LOGGER
        // ============================================================

        const debugEl = document.getElementById('debug-panel');
        function dbg(msg, level = '') {
            const ts = new Date().toLocaleTimeString('en-US', {hour12:false});
            const cls = level === 'err' ? 'dbg-err' : level === 'warn' ? 'dbg-warn' : level === 'info' ? 'dbg-info' : '';
            const line = document.createElement('div');
            line.className = cls;
            line.textContent = `[${ts}] ${msg}`;
            debugEl.appendChild(line);
            debugEl.scrollTop = debugEl.scrollHeight;
            console.log(`[DBG] ${msg}`);
        }

        // ============================================================
        // CONFIG (server-injected via Jinja)
        // ============================================================

        let avatarUrl      = "{{ avatar_url }}";
        let avatarFallback = "{{ avatar_fallback }}";
        const ASSISTANT_LABEL = "{{ avatar_name }}";

        const statusEl     = document.getElementById('status');
        const subtitleEl   = document.getElementById('subtitle');
        const chatHeader   = document.getElementById('chat-header');
        const chatMessages = document.getElementById('chat-messages');
        const btnStart     = document.getElementById('btn-start');
        const btnStop      = document.getElementById('btn-stop');
        const loadingOverlay = document.getElementById('loading-overlay');

        let head     = null;
        let socket   = null;
        let isActive = false;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        // ============================================================
        // AVATAR
        // ============================================================

        async function initAvatar() {
            try {
                const opts = {
                    cameraView: 'upper',
                    cameraRotateEnable: true,
                    lipsyncModules: ['en'],
                    lipsyncLang: 'en'
                };

                dbg('Creating TalkingHead instance...', 'info');
                head = new TalkingHead(document.getElementById('avatar-container'), opts);

                let loaded = false;
                try {
                    dbg('Loading primary avatar...', 'info');
                    await head.showAvatar({
                        url: avatarUrl,
                        body: 'F',
                        avatarMood: 'neutral',
                        lipsyncLang: 'en'
                    });
                    loaded = true;
                    dbg('Primary avatar loaded OK', 'info');
                } catch (e) {
                    dbg('Primary avatar FAILED: ' + e.message, 'warn');
                }

                if (!loaded) {
                    dbg('Loading fallback avatar...', 'info');
                    await head.showAvatar({
                        url: avatarFallback,
                        body: 'F',
                        avatarMood: 'neutral',
                        lipsyncLang: 'en'
                    });
                    dbg('Fallback avatar loaded OK', 'info');
                }

                loadingOverlay.style.display = 'none';
                setStatus('ready', 'Avatar loaded. Click Start.');

            } catch (err) {
                dbg('Avatar load error: ' + err.message, 'err');
                console.error('Avatar load error:', err);
                loadingOverlay.innerHTML = '<div style="color:#f44336">Failed to load avatar.<br>Check console for details.</div>';
            }
        }

        // ============================================================
        // SOCKET
        // ============================================================

        function initSocket() {
            return new Promise((resolve) => {
                socket = io(window.location.origin);
                let resolved = false;

                socket.on('connect', () => {
                    addSystemMessage('Connected to server');
                });

                socket.on('server_profile', (data) => {
                    if (data.avatar_url)      avatarUrl      = data.avatar_url;
                    if (data.avatar_fallback) avatarFallback = data.avatar_fallback;
                    if (!resolved) { resolved = true; resolve(); }
                });

                socket.on('status', (data) => setStatus(data.state, data.message || ''));

                socket.on('user_text', (data) => {
                    addChat(data.text, true);
                    showSubtitle('You: ' + data.text, 3000);
                });

                socket.on('assistant_speak', async (data) => {
                    addChat(data.text, false);
                    setStatus('speaking', 'Speaking...');
                    await avatarSpeak(data);
                    if (isActive) socket.emit('start_listening');
                });

                socket.on('cannot_hear', async () => {
                    setStatus('error', "Couldn't hear you");
                    addSystemMessage("Couldn't hear you clearly");
                    await avatarSpeakBrowser("I couldn't hear you. Could you repeat that?");
                    if (isActive) socket.emit('start_listening');
                });

                socket.on('disconnect', () => {
                    setStatus('error', 'Disconnected');
                    addSystemMessage('Disconnected from server');
                });

                setTimeout(() => { if (!resolved) { resolved = true; resolve(); } }, 1500);
            });
        }

        // ============================================================
        // AVATAR SPEAK
        // ============================================================

        async function avatarSpeak(data) {
            showSubtitle(data.text);
            if (data.audio && data.words) {
                await avatarSpeakWithAudio(data);
            } else {
                await avatarSpeakBrowser(data.text);
            }
            hideSubtitle();
        }

        const SUPPORTED_LIPSYNC_LANGS = { 'en': 'en', 'fi': 'fi', 'lt': 'lt' };

        function isNonLatin(text) {
            const latinCount = (text.match(/[a-zA-Z]/g) || []).length;
            const totalAlpha = (text.match(/\p{L}/gu) || []).length;
            return totalAlpha > 0 && (latinCount / totalAlpha) < 0.5;
        }

        function adaptWordsForLipsync(words, lang) {
            if (SUPPORTED_LIPSYNC_LANGS[lang]) return words;
            return words.map(w => {
                if (!isNonLatin(w)) return w;
                const syllables = Math.max(1, Math.ceil(w.length / 2));
                const patterns = ['ba', 'da', 'ma', 'la', 'na'];
                let out = '';
                for (let i = 0; i < syllables; i++) out += patterns[i % patterns.length];
                return out;
            });
        }

        async function avatarSpeakWithAudio(data) {
            try {
                const binaryStr = atob(data.audio);
                const len = binaryStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binaryStr.charCodeAt(i);

                const ctx = getAudioContext();
                if (ctx.state === 'suspended') await ctx.resume();
                const audioBuffer = await ctx.decodeAudioData(bytes.buffer.slice(0));
                dbg('Decoded audio: ' + audioBuffer.duration.toFixed(2) + 's', 'info');

                const lang = data.lang || 'en';
                const lipsyncLang  = SUPPORTED_LIPSYNC_LANGS[lang] || 'en';
                const lipsyncWords = adaptWordsForLipsync(data.words, lang);

                const speakData = {
                    audio: audioBuffer,
                    words: lipsyncWords,
                    wtimes: data.wtimes,
                    wdurations: data.wdurations
                };

                await new Promise((resolve) => {
                    let resolved = false;
                    const finish = () => { if (!resolved) { resolved = true; resolve(); } };
                    try {
                        head.speakAudio(speakData, { lipsyncLang }, () => {});
                    } catch (e) {
                        dbg('speakAudio threw: ' + e.message, 'err');
                        finish(); return;
                    }
                    const checkDone = setInterval(() => {
                        if (!head.isSpeaking) { clearInterval(checkDone); finish(); }
                    }, 250);
                    setTimeout(() => {
                        clearInterval(checkDone); finish();
                    }, (audioBuffer.duration * 1000) + 5000);
                });

            } catch (err) {
                dbg('Audio play error: ' + err.message, 'err');
                await avatarSpeakBrowser(data.text);
            }
        }

        async function avatarSpeakBrowser(text) {
            window.speechSynthesis.cancel();
            const words = text.split(/\s+/).filter(w => w.length > 0);
            if (words.length === 0) return;
            await new Promise((resolve) => {
                let resolved = false;
                const finish = () => { if (!resolved) { resolved = true; resolve(); } };
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
                utterance.onend = utterance.onerror = finish;
                setTimeout(() => { window.speechSynthesis.cancel(); finish(); }, words.length * 600 + 5000);
                window.speechSynthesis.speak(utterance);
            });
        }

        // ============================================================
        // UI
        // ============================================================

        function setStatus(state, message) {
            const labels = {
                ready: 'Ready', listening: 'Listening...', processing: 'Processing...',
                thinking: 'Thinking...', speaking: 'Speaking...', error: 'Error',
                connected: 'Connected'
            };
            statusEl.textContent = message || labels[state] || state;
            document.body.classList.toggle('listening', state === 'listening');
        }

        function showSubtitle(text, duration) {
            subtitleEl.textContent = text;
            subtitleEl.style.display = 'block';
            if (duration) setTimeout(hideSubtitle, duration);
        }
        function hideSubtitle() { subtitleEl.style.display = 'none'; }

        function addChat(text, isUser) {
            const label = document.createElement('div');
            label.className = 'msg-label ' + (isUser ? 'msg-label-user' : 'msg-label-assistant');
            label.textContent = isUser ? 'You' : ASSISTANT_LABEL;
            chatMessages.appendChild(label);

            const div = document.createElement('div');
            div.className = 'msg ' + (isUser ? 'msg-user' : 'msg-assistant');
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-system';
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============================================================
        // CONTROLS
        // ============================================================

        btnStart.addEventListener('click', async () => {
            isActive = true;
            btnStart.style.display = 'none';
            btnStop.style.display  = 'inline-block';
            addSystemMessage('Conversation started');
            setStatus('speaking', 'Speaking...');
            socket.emit('request_greeting');
        });

        btnStop.addEventListener('click', () => {
            isActive = false;
            btnStart.style.display = 'inline-block';
            btnStop.style.display  = 'none';
            setStatus('ready', 'Stopped');
            socket.emit('stop_listening');
            addSystemMessage('Conversation stopped');
            hideSubtitle();
        });

        // ============================================================
        // INIT
        // ============================================================

        window.addEventListener('DOMContentLoaded', async () => {
            chatHeader.textContent = ASSISTANT_LABEL;
            await initSocket();
            await initAvatar();
        });
    </script>
</body>
</html>
